          type: web
          envVarKey: MAILGUN_SENDER_EMAIL
      - key: EMAIL_FROM_NAME
        fromService:
          name: smart-prop-api
          type: web
          envVarKey: EMAIL_FROM_NAME
      - key: FROM_EMAIL
