# Scheduled jobs run from GitHub Actions (.github/workflows/reminders-due.yml and
# delivery-outbox.yml). Do not add Render cron services here as well.
# The smart-prop-worker block at the bottom is the planned replacement (paid worker).
# Cutover steps: docs/ops-checklist.md → "Background worker cutover".
services:
  - type: web
    name: smart-prop-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: EMAIL_SERVICE_PROVIDER
        value: mailgun
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_API_BASE_URL
        value: https://api.mailgun.net
      - key: MAILGUN_SENDER_EMAIL
        sync: false
      - key: EMAIL_FROM_NAME
        value: Nexora
      - key: FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # API worker processes (Dockerfile default 2). Raise to 3-4 only on a 1 GB+ plan.
      # - key: WEB_CONCURRENCY
      #   value: "2"
      # Set to "0" to verify every token with Supabase Auth instead of the signing keys.
      # - key: AUTH_LOCAL_JWT
      #   value: "0"
      # Optional Host allowlist (lib/edge.py); add custom domains before DNS moves.
      # - key: ALLOWED_HOSTS
      #   value: smart-prop-manager.onrender.com
      # Set to "0" once smart-prop-worker is live, so requests stop sending inline.
      # - key: OUTBOX_INLINE_FLUSH
      #   value: "0"

