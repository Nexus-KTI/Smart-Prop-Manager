name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Import check
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
        run: python -c "from dotenv import load_dotenv; load_dotenv(); import main; print('ok', main.app.title)"
      - name: Unit tests (no DB)
        run: python -m pytest tests/ -q

  api-e2e-smoke:
    runs-on: ubuntu-latest
    # Requires repo secrets pointing at a staging API + Supabase smoke user
    if: ${{ secrets.SMOKE_SUPABASE_URL != '' && secrets.SMOKE_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run smoke_e2e against staging
        env:
          SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.SMOKE_API_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python scripts/smoke_e2e.py

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
